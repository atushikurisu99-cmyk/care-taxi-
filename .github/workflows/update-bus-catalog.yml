name: Update Hiroshima bus destination catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    paths:
      - "tools/update_hiroshima_bus_catalog.py"
      - ".github/workflows/update-bus-catalog.yml"

permissions:
  contents: write

concurrency:
  group: bus-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build destination catalog from GTFS-JP
        run: python tools/update_hiroshima_bus_catalog.py
      - name: Commit generated catalog
        run: |
          if [ -z "$(git status --porcelain -- sales-nav-prototype/data/bus-destination-catalog.json)" ]; then
            echo "No catalog change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales-nav-prototype/data/bus-destination-catalog.json
          git commit -m "Update Hiroshima bus destination catalog"
          git pull --rebase origin main
          git push
