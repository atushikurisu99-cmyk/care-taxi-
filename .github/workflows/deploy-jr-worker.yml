name: Deploy JR Worker proxy

on:
  push:
    paths:
      - "workers/jr-higashima-proxy/**"
      - ".github/workflows/deploy-jr-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/jr-higashima-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy temporary validation Worker
        run: npx wrangler deploy --temporary
