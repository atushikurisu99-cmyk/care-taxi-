name: Deploy JR Worker proxy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/jr-higashima-proxy/**"
      - ".github/workflows/deploy-jr-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/jr-higashima-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate live endpoints
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = "https://taxi-jr-higashima-proxy.atushi-works.workers.dev"
          time.sleep(2)
          for path in ["/health", "/api/jr/hiroshima", "/api/events/hiroshima", "/api/sports/hiroshima"]:
              with urllib.request.urlopen(base + path, timeout=20) as r:
                  data = json.load(r)
              assert data.get("ok") is True, (path, data)
              print(path, "OK")
          PY
