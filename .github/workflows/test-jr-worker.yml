name: Test JR Worker proxy

on:
  push:
    paths:
      - "workers/jr-higashima-proxy/**"
      - ".github/workflows/test-jr-worker.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check workers/jr-higashima-proxy/index.mjs
      - name: Unit test
        run: node workers/jr-higashima-proxy/test.mjs
