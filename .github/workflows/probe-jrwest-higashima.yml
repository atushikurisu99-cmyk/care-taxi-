name: Probe JR West Hiroshima data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "tools/probe_jrwest_hiroshima.py"
      - ".github/workflows/probe-jrwest-higashima.yml"

permissions:
  contents: write

concurrency:
  group: jrwest-higashima-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch JR West technical probe
        run: python tools/probe_jrwest_hiroshima.py
      - name: Check browser CORS header
        run: |
          python - <<'PY'
          import urllib.request
          u="https://www.train-guide.westjr.co.jp/api/v3/area_hiroshima_master.json"
          req=urllib.request.Request(u, method="HEAD", headers={"Origin":"https://atushikurisu99-cmyk.github.io","User-Agent":"Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("status", r.status)
                  print("access-control-allow-origin", r.headers.get("Access-Control-Allow-Origin"))
                  print("access-control-allow-methods", r.headers.get("Access-Control-Allow-Methods"))
          except Exception as e:
              print("cors_check_error", repr(e))
          PY
      - name: Show compact summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("tmp/jrwest-higashima-probe.json", encoding="utf-8"))
          print(json.dumps(p["summary"], ensure_ascii=False, indent=2))
          for x in p["lines"]:
              if x["train_count"]:
                  print(x["code"], x["name"], x["train_count"], "trains")
          PY
      - name: Publish temporary UI snapshot
        run: |
          mkdir -p sales-nav-prototype/data
          cp tmp/jrwest-higashima-probe.json sales-nav-prototype/data/jrwest-higashima-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales-nav-prototype/data/jrwest-higashima-probe.json
          if git diff --cached --quiet; then
            echo "No snapshot change"
          else
            git commit -m "Update JR West technical probe snapshot"
            git push
          fi
      - name: Upload temporary probe result
        uses: actions/upload-artifact@v4
        with:
          name: jrwest-higashima-probe
          path: tmp/jrwest-higashima-probe.json
          retention-days: 3
