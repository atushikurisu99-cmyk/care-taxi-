name: Update JARTIC Hiroshima speed data

on:
  push:
    paths:
      - "tools/update_jartic_hiroshima.py"
      - ".github/workflows/update-jartic-speed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and reduce JARTIC data
        run: python tools/update_jartic_hiroshima.py
      - name: Commit generated data
        run: |
          if [ -z "$(git status --porcelain -- sales-nav-prototype/data/jartic-hiroshima-speed.json)" ]; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales-nav-prototype/data/jartic-hiroshima-speed.json
          git commit -m "Update JARTIC Hiroshima speed data"
          git push
