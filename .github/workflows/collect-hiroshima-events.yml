name: Collect Hiroshima taxi demand events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/collect-hiroshima-events.cjs"
      - ".github/workflows/collect-hiroshima-events.yml"

permissions:
  contents: write

concurrency:
  group: collect-hiroshima-events
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser fallback
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Collect sources
        run: node scripts/collect-hiroshima-events.cjs

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-source-debug
          path: tmp/event-source-debug
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate snapshot
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('sales-nav-prototype/data/hiroshima-demand-events.json','utf8'));
          if(p?.ok!==true||!Array.isArray(p.events)) throw new Error('invalid snapshot');
          if(!p.source_health||Object.keys(p.source_health).length<5) throw new Error('missing source health');
          const bad=p.events.filter(x=>!x.date||!x.name||!x.venue);
          if(bad.length) throw new Error('invalid events '+bad.length);
          const status=JSON.parse(fs.readFileSync('sales-nav-prototype/data/hiroshima-demand-source-status.json','utf8'));
          if(status?.ok!==true||!status.source_health||!status.source_registry) throw new Error('invalid source status snapshot');
          const history=JSON.parse(fs.readFileSync('sales-nav-prototype/data/hiroshima-demand-source-history.json','utf8'));
          if(!history?.sources||typeof history.sources!=='object') throw new Error('invalid source history snapshot');
          const h=p.source_health||{};
          const minimums={icch:5,candy:5,dive:1,sports:5,worker_events:5,lawson:20,pia:5,city_events:1,published_details:5,convention_official:5,national_convention:4};
          for(const [id,min] of Object.entries(minimums)){
            if(h[id]?.ok!==true || Number(h[id]?.count||0)<min){
              throw new Error('source regression '+id+' count='+(h[id]?.count??'null'));
            }
          }
          const eplusVisible=p.events.filter(x=>(x.sources||[]).includes('イープラス')).length;
          const eplusHistory=Number(history?.sources?.eplus?.reference_count||0);
          const eplusCurrent=Number(h.eplus?.count||0);
          const eplusRetained=Number(h.eplus?.retained_future_count||0);
          if(eplusVisible<60 || eplusHistory<100){
            throw new Error('Eplus effective coverage regression visible='+eplusVisible+' current='+eplusCurrent+' retained='+eplusRetained+' history='+eplusHistory);
          }
          const sportsPt=p.events.filter(x=>(x.sources||[]).includes('全国学会公式')&&Number(x.people||0)===1300&&['2026-12-19','2026-12-20'].includes(String(x.date||'')));
          if(sportsPt.length<2) throw new Error('sports PT convention participant total missing');
          const womensPt=p.events.filter(x=>(x.sources||[]).includes('全国学会公式')&&['2026-11-28','2026-11-29'].includes(String(x.date||'')));
          if(womensPt.length<2) throw new Error('women/men health PT convention missing');

          if(Number(p.counts?.merged||0)<30) throw new Error('coverage regression: too few merged events');
          const venues=new Set(p.events.map(x=>x.venue).filter(Boolean));
          if(venues.size<7) throw new Error('coverage regression: too few venues '+venues.size);
          const groups=new Set(p.events.map(x=>x.event_type).filter(Boolean));
          for(const needed of ['music','sports','convention','festival']){
            if(!groups.has(needed)) throw new Error('coverage regression: missing '+needed);
          }

          const outside=/廿日市|はつかいち|さくらぴあ|東広島|呉市|福山市|福山|三原|尾道|三次|庄原|江田島|大竹/;
          const badTitle=/販売終了|予定枚数終了|一般発売|受付中|公演日[:：]|会場[:：]|sports_basketball/;
          const outsideRows=p.events.filter(x=>outside.test(String(x.name||'')+' '+String(x.venue||'')));
          if(outsideRows.length) throw new Error('outside-city event leaked: '+outsideRows[0].name);
          const badTitles=p.events.filter(x=>badTitle.test(String(x.name||'')));
          if(badTitles.length) throw new Error('ticket metadata leaked into title: '+badTitles[0].name);

          const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s「」『』【】()（）・!！?？:：,，.。\-ー〜～]/g,'');
          const convNorm=s=>norm(s).replace(/学会学術大会/g,'学術大会');
          for(let i=0;i<p.events.length;i++){
            for(let j=i+1;j<p.events.length;j++){
              const a=p.events[i],b=p.events[j];
              if(a.date!==b.date||a.venue!==b.venue) continue;
              const an=norm(a.name),bn=norm(b.name);
              const convDup=a.event_type==='convention'&&b.event_type==='convention'&&(
                convNorm(a.name)===convNorm(b.name)||
                convNorm(a.name).includes(convNorm(b.name))||
                convNorm(b.name).includes(convNorm(a.name))
              );
              if(an===bn||an.includes(bn)||bn.includes(an)||convDup){
                throw new Error('duplicate event '+a.date+' '+a.venue+' '+a.name+' / '+b.name);
              }
            }
          }

          if(Number(history?.sources?.eplus?.reference_count||0)<100){
            throw new Error('Eplus best-known reference history missing');
          }
          console.log(JSON.stringify({
            generated_at:p.generated_at,
            counts:p.counts,
            health:p.source_health,
            first:p.events.slice(0,20).map(x=>({
              date:x.date,name:x.name,venue:x.venue,people:x.people,
              people_basis:x.people_basis,start_time:x.start_time,end_time:x.end_time,
              event_type:x.event_type,sources:x.sources
            }))
          },null,2));
          NODE

      - name: Commit updated snapshot
        id: snapshot
        run: |
          if [ -z "$(git status --porcelain -- sales-nav-prototype/data/hiroshima-demand-events.json sales-nav-prototype/data/hiroshima-demand-source-status.json sales-nav-prototype/data/hiroshima-demand-source-history.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "taxi-event-collector[bot]"
          git config user.email "taxi-event-collector[bot]@users.noreply.github.com"
          git add sales-nav-prototype/data/hiroshima-demand-events.json sales-nav-prototype/data/hiroshima-demand-source-status.json sales-nav-prototype/data/hiroshima-demand-source-history.json
          git commit -m "Update Hiroshima demand event snapshot"
          if ! git push; then
            echo "Remote changed during collection; rebasing snapshot commit"
            git fetch origin main
            git rebase origin/main
            git push
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed snapshot to Cloudflare Pages
        if: steps.snapshot.outputs.changed == 'true'
        run: npx --yes wrangler@latest pages deploy sales-nav-prototype --project-name=taxi-sales-nav --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed demand snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          node - <<'NODE'
          const fs=await import('node:fs');
          const expected=JSON.parse(fs.readFileSync('./sales-nav-prototype/data/hiroshima-demand-events.json','utf8'));
          const url='https://taxi-sales-nav.pages.dev/data/hiroshima-demand-events.json?ts='+Date.now();
          let got=null;
          for(let i=0;i<6;i++){
            const r=await fetch(url+'&try='+i,{headers:{accept:'application/json'}});
            if(r.ok){
              got=await r.json();
              if(String(got?.generated_at)===String(expected.generated_at)) break;
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(got?.ok!==true||!Array.isArray(got.events)) throw new Error('invalid production snapshot');
          if(String(got.generated_at)!==String(expected.generated_at)) throw new Error('production snapshot is stale');
          console.log(JSON.stringify({generated_at:got.generated_at,count:got.events.length},null,2));
          NODE
