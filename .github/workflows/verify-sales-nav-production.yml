name: Verify sales-nav production display

on:
  push:
    branches:
      - main
    paths:
      - "sales-nav-prototype/**"
      - "workers/jr-higashima-proxy/**"
      - ".github/workflows/verify-sales-nav-production.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps webkit
      - name: Verify rendered event names on production
        run: |
          node - <<'NODE'
          (async()=>{
          const { webkit } = require('playwright');
          const target='https://taxi-sales-nav.pages.dev/';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected=[
            {date:'2026-10-09',venue:'JMSアステールプラザ',name:'PERSONZ'},
            {date:'2026-10-17',venue:'広島サンプラザホール',name:'After the Rain'},
            {date:'2026-10-17',venue:'広島グリーンアリーナ',name:'NEWS'}
          ];
          const expectedSports=[
            {date:'2026-10-17',venue:'エディオンピースウイング広島',name:'サンフレッチェ広島'},
            {date:'2026-10-31',venue:'広島グリーンアリーナ',name:'広島サンダーズ'},
            {date:'2026-11-21',venue:'広島サンプラザホール',name:'広島サンダーズ'}
          ];
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({viewport:{width:393,height:852},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
          const page=await context.newPage();
          let last=[];
          let ok=false;
          for(let attempt=1; attempt<=5; attempt++){
            await page.goto(target+'?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);

            // Core UI contract: reservation time mode removed, notification types are selectable,
            // and the Hiroshima Sogo template can be populated through demo operation data.
            await page.evaluate(()=>{ if(typeof show==='function') show('home'); });
            const badgeBox=await page.locator('#badge').boundingBox();
            const badgeText=await page.locator('#badge').innerText();
            const badgeLineHeight=await page.locator('#badge').evaluate(el=>parseFloat(getComputedStyle(el).lineHeight));
            if(!badgeBox||!badgeText.includes('未乗務')||badgeBox.height>badgeLineHeight*2.1){
              throw new Error('home duty badge is wrapping or missing: '+JSON.stringify({badgeText,badgeBox,badgeLineHeight}));
            }
            const titleBox=await page.locator('#title').boundingBox();
            const stateBox=await page.locator('#homeHeaderState').boundingBox();
            if(titleBox&&stateBox&&titleBox.x+titleBox.width>stateBox.x){
              throw new Error('home header title overlaps duty state');
            }

            await page.evaluate(()=>{ if(typeof show==='function') show('menu'); });
            await page.waitForTimeout(250);
            const menu=page.locator('#menu');
            if(!await menu.isVisible()) throw new Error('menu screen not visible');
            const menuItems=page.locator('#menu .menuitem');
            const menuCount=await menuItems.count();
            if(menuCount<8) throw new Error('menu items missing: '+menuCount);
            const menuText=await menu.innerText();
            for(const label of ['ホーム','本日の営業情報','売上・実績','営業分析','位置・警告検証','日報確認','月報・帳票出力','設定']){
              if(!menuText.includes(label)) throw new Error('menu label not rendered: '+label);
            }
            const menuBox=await menu.boundingBox();
            const firstMenuBox=await menuItems.first().boundingBox();
            const viewport=page.viewportSize();
            const menuParent=await menu.evaluate(el=>({parent:el.parentElement?.tagName||'',grand:el.parentElement?.parentElement?.className||''}));
            if(!menuBox||!firstMenuBox||firstMenuBox.width<100||firstMenuBox.height<40||!viewport||menuBox.y<0||menuBox.y+Math.min(menuBox.height,firstMenuBox.height)>viewport.height||firstMenuBox.y<0||firstMenuBox.y+firstMenuBox.height>viewport.height||menuParent.parent!=='MAIN'){
              throw new Error('menu not actually visible in app viewport: '+JSON.stringify({menuBox,firstMenuBox,menuCount,viewport,menuParent}));
            }
            await page.screenshot({path:'/tmp/menu-production.png',fullPage:false});
            console.log('MENU_RENDER_OK',JSON.stringify({menuCount,menuBox,firstMenuBox,menuText:menuText.slice(0,500)}));

            await page.evaluate(()=>{ if(typeof show==='function') show('reservationEdit'); });
            const reservationText=await page.locator('#reservationEdit').innerText();
            if(reservationText.includes('時間指定')) throw new Error('legacy reservation time-mode toggle still visible');
            const reservationLabels=await page.locator('#reservationEdit .form-label').allTextContents();
            const expectedOrder=['日付','お名前','時刻','お迎え場所','行き先'];
            let lastIndex=-1;
            for(const label of expectedOrder){
              const idx=reservationLabels.findIndex((x,i)=>i>lastIndex&&x.includes(label));
              if(idx<0) throw new Error('reservation field order missing '+label+': '+JSON.stringify(reservationLabels));
              lastIndex=idx;
            }

            await page.evaluate(()=>{ show('settings'); openSettingsSection('notifications'); });
            if(!await page.locator('#notificationTypeRoot').isVisible()) throw new Error('notification type root not visible');
            await page.locator('#notificationTypeRoot button').filter({hasText:'バス通知'}).click();
            if(!await page.locator('#notificationSectionBus').isVisible()) throw new Error('bus notification settings not selectable');
            await page.locator('#busWard中区').click();

            await page.evaluate(()=>{ show('monthlyReport'); });
            if(!await page.locator('.report-template-fixed').getByText('相互個人タクシー協同組合').isVisible()) throw new Error('Sogo template name missing');
            await page.locator('#monthlyReport .monthly-report-actions button.demo').click();
            await page.waitForTimeout(150);
            const preview=page.locator('#monthlyReportPreview');
            if(await preview.isVisible()) throw new Error('demo button must not open preview automatically');
            await page.locator('#monthlyReportPreviewButton').click();
            await page.waitForTimeout(150);
            const previewText=await preview.innerText();
            console.log('MONTHLY_PREVIEW_TEXT',previewText.slice(0,2500));
            for(const required of ['相互個人タクシー協同組合','運 転 日 報','乗車地','降車地','日 常 点 検','52340','広島 300 あ 13-94']){
              if(!previewText.includes(required)) throw new Error('monthly preview missing '+required+': '+previewText.slice(0,1200));
            }
            if(!await preview.isVisible()) throw new Error('monthly preview did not become visible after demo');
            const sheet=page.locator('#monthlyReportPreview .sogo-sheet');
            const firstPage=page.locator('#monthlyReportPreview .sogo-page').first();
            const title=page.locator('#monthlyReportPreview .sogo-title').first();
            const topTable=page.locator('#monthlyReportPreview .sogo-top').first();
            const tripTable=page.locator('#monthlyReportPreview .sogo-trip').first();
            const reportTitleBox=await title.boundingBox();
            const pageBox=await firstPage.boundingBox();
            const topBox=await topTable.boundingBox();
            const titleStyle=await title.evaluate(el=>({fontSize:parseFloat(getComputedStyle(el).fontSize),color:getComputedStyle(el).color,display:getComputedStyle(el).display}));
            const tripRows=await tripTable.locator('tbody tr').count();
            const firstTripCells=await tripTable.locator('tbody tr').first().locator('td').count();
            const topFirstRowCells=await topTable.locator('tbody tr').first().locator('td').count();
            const visibleDemoValues=await firstPage.innerText();
            if(!reportTitleBox||!pageBox||!topBox||reportTitleBox.width<120||reportTitleBox.height<20||titleStyle.fontSize<24){
              throw new Error('Sogo title is not visibly laid out: '+JSON.stringify({reportTitleBox,pageBox,topBox,titleStyle}));
            }
            if(reportTitleBox.y<pageBox.y||reportTitleBox.y+reportTitleBox.height>topBox.y){
              throw new Error('Sogo title overlaps or escapes header area: '+JSON.stringify({reportTitleBox,pageBox,topBox}));
            }
            if(tripRows!==20||firstTripCells!==9||topFirstRowCells<7){
              throw new Error('Sogo grid structure broken: '+JSON.stringify({tripRows,firstTripCells,topFirstRowCells}));
            }
            for(const value of ['52340','52462','広島駅 新幹線口','八丁堀','1,780']){
              if(!visibleDemoValues.includes(value)) throw new Error('Sogo visible demo value missing: '+value);
            }
            const tripFont=await tripTable.locator('tbody td').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
            if(tripFont<9) throw new Error('Sogo trip text too small: '+tripFont);
            console.log('SOGO_VISUAL_STRUCTURE_OK',JSON.stringify({reportTitleBox,pageBox,topBox,titleStyle,tripRows,firstTripCells,topFirstRowCells,tripFont}));
            await page.screenshot({path:'/tmp/monthly-preview-template-v2.png',fullPage:false});
            await page.locator('#monthlyReportPreview .monthly-preview-close').click();
            if(await preview.isVisible()) throw new Error('monthly preview did not close');
            await page.locator('#monthlyReportPreviewButton').click();
            await page.waitForTimeout(150);
            if(!await preview.isVisible()) throw new Error('monthly preview button did not open preview');

            await page.evaluate(()=>{ if(typeof openCalendarDayDetail==='function') openCalendarDayDetail('2026-10-09'); });
            await page.waitForTimeout(150);
            const liveCards=page.locator('#calendarDetailList .calendar-detail-item.live');
            const liveCount=await liveCards.count();
            if(liveCount<1) throw new Error('no live cards for 2026-10-09');
            const liveTexts=await liveCards.allInnerTexts();
            if(liveTexts.some(t=>t.includes('終演見込 --:--'))) throw new Error('live end estimate still missing: '+JSON.stringify(liveTexts));
            const personz=liveTexts.find(t=>t.includes('PERSONZ'))||'';
            if(!personz.includes('終演見込 21:00')) throw new Error('PERSONZ end estimate wrong: '+personz);
            console.log('LIVE_END_ESTIMATE_OK',JSON.stringify(liveTexts.slice(0,8)));
            await page.evaluate(()=>{ if(typeof closeCalendarDayDetail==='function') closeCalendarDayDetail(); });
            const previewBox=await preview.boundingBox();
            const vp=page.viewportSize();
            const closeVisible=await page.locator('#monthlyReportPreview .monthly-preview-close').isVisible();
            if(!previewBox||!vp||previewBox.y>1||previewBox.width<vp.width-4||previewBox.height<vp.height-4||!closeVisible){
              throw new Error('monthly preview is not full-screen visible on iPhone viewport: '+JSON.stringify({previewBox,vp,closeVisible}));
            }
            await page.screenshot({path:'/tmp/monthly-preview-production.png',fullPage:false});

            await page.evaluate(()=>{ if(typeof show==='function') show('eventDetail'); });
            await page.waitForTimeout(3000);
            last=await page.locator('#eventDetailLiveList .calendar-detail-item.live').evaluateAll(items=>items.map(el=>({
              kind:el.querySelector('.kind')?.textContent?.trim()||'',
              main:el.querySelector('.main')?.textContent?.trim()||'',
              meta:el.querySelector('.meta')?.textContent?.trim()||''
            })));
            const sports=await page.locator('#eventDetailSportsList .calendar-detail-item').evaluateAll(items=>items.map(el=>({
              kind:el.querySelector('.kind')?.textContent?.trim()||'',
              main:el.querySelector('.main')?.textContent?.trim()||'',
              meta:el.querySelector('.meta')?.textContent?.trim()||''
            })));
            const snapshot={attempt,live:last.slice(0,30),sports:sports.slice(0,30)};
            require('fs').writeFileSync('/tmp/prod-verify.json',JSON.stringify(snapshot,null,2));
            console.log('ATTEMPT',attempt,JSON.stringify(snapshot,null,2));
            const liveOk=expected.every(x=>last.some(e=>e.kind.includes(x.date)&&e.meta.includes(x.venue)&&e.main===x.name));
            const sportsOk=expectedSports.every(x=>sports.some(e=>e.kind.includes(x.date)&&e.meta.includes(x.venue)&&e.main.startsWith(x.name)));
            ok=liveOk&&sportsOk;
            if(ok) break;
            await sleep(5000);
          }
          await browser.close();
          if(!ok){
            throw new Error('production rendered names did not match fixed-field extraction: '+JSON.stringify({expected,last:last.slice(0,20)}));
          }
          console.log('PRODUCTION_DISPLAY_OK',JSON.stringify({live:expected,sports:expectedSports}));
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE

      - name: Upload production render snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-render-snapshot
          path: |
            /tmp/prod-verify.json
            /tmp/menu-production.png
            /tmp/monthly-preview-production.png
            /tmp/monthly-preview-template-v2.png
          if-no-files-found: ignore
          retention-days: 1

