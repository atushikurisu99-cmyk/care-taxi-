name: Verify sales-nav production display

on:
  push:
    branches:
      - main
    paths:
      - "sales-nav-prototype/**"
      - "workers/jr-higashima-proxy/**"
      - ".github/workflows/verify-sales-nav-production.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Verify rendered event names on production
        run: |
          node - <<'NODE'
          (async()=>{
          const { chromium } = require('playwright');
          const target='https://taxi-sales-nav.pages.dev/';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected=[
            {date:'2026-10-09',venue:'JMSアステールプラザ',name:'PERSONZ'},
            {date:'2026-10-17',venue:'広島サンプラザホール',name:'After the Rain'},
            {date:'2026-10-17',venue:'広島グリーンアリーナ',name:'NEWS'}
          ];
          const expectedSports=[
            {date:'2026-10-17',venue:'エディオンピースウイング広島',name:'サンフレッチェ広島'},
            {date:'2026-10-31',venue:'広島グリーンアリーナ',name:'広島サンダーズ'},
            {date:'2026-11-21',venue:'広島サンプラザホール',name:'広島サンダーズ'}
          ];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          let last=[];
          let ok=false;
          for(let attempt=1; attempt<=5; attempt++){
            await page.goto(target+'?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);

            // Core UI contract: reservation time mode removed, notification types are selectable,
            // and the Hiroshima Sogo template can be populated through demo operation data.
            await page.evaluate(()=>{ if(typeof show==='function') show('home'); });
            const badgeBox=await page.locator('#badge').boundingBox();
            const badgeText=await page.locator('#badge').innerText();
            const badgeLineHeight=await page.locator('#badge').evaluate(el=>parseFloat(getComputedStyle(el).lineHeight));
            if(!badgeBox||!badgeText.includes('未乗務')||badgeBox.height>badgeLineHeight*2.1){
              throw new Error('home duty badge is wrapping or missing: '+JSON.stringify({badgeText,badgeBox,badgeLineHeight}));
            }
            const titleBox=await page.locator('#title').boundingBox();
            const stateBox=await page.locator('#homeHeaderState').boundingBox();
            if(titleBox&&stateBox&&titleBox.x+titleBox.width>stateBox.x){
              throw new Error('home header title overlaps duty state');
            }

            await page.evaluate(()=>{ if(typeof show==='function') show('reservationEdit'); });
            const reservationText=await page.locator('#reservationEdit').innerText();
            if(reservationText.includes('時間指定')) throw new Error('legacy reservation time-mode toggle still visible');
            const reservationLabels=await page.locator('#reservationEdit .form-label').allTextContents();
            const expectedOrder=['日付','お名前','時刻','お迎え場所','行き先'];
            let lastIndex=-1;
            for(const label of expectedOrder){
              const idx=reservationLabels.findIndex((x,i)=>i>lastIndex&&x.includes(label));
              if(idx<0) throw new Error('reservation field order missing '+label+': '+JSON.stringify(reservationLabels));
              lastIndex=idx;
            }

            await page.evaluate(()=>{ show('settings'); openSettingsSection('notifications'); });
            if(!await page.locator('#notificationTypeRoot').isVisible()) throw new Error('notification type root not visible');
            await page.locator('#notificationTypeRoot button').filter({hasText:'バス通知'}).click();
            if(!await page.locator('#notificationSectionBus').isVisible()) throw new Error('bus notification settings not selectable');
            await page.locator('#busWard中区').click();

            await page.evaluate(()=>{ show('monthlyReport'); });
            if(!await page.locator('.report-template-fixed').getByText('相互個人タクシー協同組合').isVisible()) throw new Error('Sogo template name missing');
            await page.locator('#monthlyReport .monthly-report-actions button.demo').click();
            await page.waitForTimeout(300);
            const previewText=await page.locator('#monthlyReportPreview').innerText();
            if(!previewText.includes('相互個人タクシー協同組合')||!previewText.includes('運転日報')||!previewText.includes('広島駅 新幹線口')){
              throw new Error('demo operation data did not reach report preview');
            }

            await page.evaluate(()=>{ if(typeof show==='function') show('eventDetail'); });
            await page.waitForTimeout(3000);
            last=await page.locator('#eventDetailLiveList .calendar-detail-item.live').evaluateAll(items=>items.map(el=>({
              kind:el.querySelector('.kind')?.textContent?.trim()||'',
              main:el.querySelector('.main')?.textContent?.trim()||'',
              meta:el.querySelector('.meta')?.textContent?.trim()||''
            })));
            const sports=await page.locator('#eventDetailSportsList .calendar-detail-item').evaluateAll(items=>items.map(el=>({
              kind:el.querySelector('.kind')?.textContent?.trim()||'',
              main:el.querySelector('.main')?.textContent?.trim()||'',
              meta:el.querySelector('.meta')?.textContent?.trim()||''
            })));
            const snapshot={attempt,live:last.slice(0,30),sports:sports.slice(0,30)};
            require('fs').writeFileSync('/tmp/prod-verify.json',JSON.stringify(snapshot,null,2));
            console.log('ATTEMPT',attempt,JSON.stringify(snapshot,null,2));
            const liveOk=expected.every(x=>last.some(e=>e.kind.includes(x.date)&&e.meta.includes(x.venue)&&e.main===x.name));
            const sportsOk=expectedSports.every(x=>sports.some(e=>e.kind.includes(x.date)&&e.meta.includes(x.venue)&&e.main.startsWith(x.name)));
            ok=liveOk&&sportsOk;
            if(ok) break;
            await sleep(5000);
          }
          await browser.close();
          if(!ok){
            throw new Error('production rendered names did not match fixed-field extraction: '+JSON.stringify({expected,last:last.slice(0,20)}));
          }
          console.log('PRODUCTION_DISPLAY_OK',JSON.stringify({live:expected,sports:expectedSports}));
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE

      - name: Upload production render snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-render-snapshot
          path: /tmp/prod-verify.json
          if-no-files-found: ignore
          retention-days: 1

