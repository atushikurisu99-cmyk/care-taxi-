name: Test national convention source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect-hiroshima-events.cjs"
      - ".github/workflows/test-national-convention-source.yml"

jobs:
  test-national-convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser fallback
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run national convention only
        env:
          EVENT_SOURCE_ONLY: national_convention
        run: node scripts/collect-hiroshima-events.cjs
      - name: Verify source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('tmp/event-source-debug/national_convention-result.json','utf8'));
          console.log(JSON.stringify(p,null,2));
          if(p?.health?.national_convention?.ok!==true) throw new Error('national convention unhealthy');
          if(!Array.isArray(p.events)||p.events.length<4) throw new Error('too few events');
          const s=p.events.filter(x=>(x.sources||[x.source]).includes('全国学会公式')&&Number(x.people||0)===1300&&['2026-12-19','2026-12-20'].includes(String(x.date||'')));
          if(s.length<2) throw new Error('1300 expected participants missing');
          NODE
